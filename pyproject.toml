[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-vector-search"
version = "0.1.0"
description = "Agentic document search: grep, read, and follow the reference. A vector index is optional."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sumit Bopche" }]
keywords = ["rag", "agents", "search", "grep", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.60"]
ingest = ["pypdf>=5", "python-docx>=1.1"]
rag = ["chromadb>=0.6"]
all = [
    "anthropic>=0.40",
    "openai>=1.60",
    "pypdf>=5",
    "python-docx>=1.1",
    "chromadb>=0.6",
]
dev = ["pytest>=8", "pypdf>=5", "python-docx>=1.1"]

[project.scripts]
bvs = "beyond_vector_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beyond_vector_search = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
